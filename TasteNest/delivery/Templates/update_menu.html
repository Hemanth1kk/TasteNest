


{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Menu</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

<div class="update-menu-container">

    <div class="menu-form">

        <h1>Add Menu Item</h1>

        <form action="{% url 'update_menu' restaurant.id %}" method="POST">

            {% csrf_token %}

            <label>Item Name</label>
            <input type="text" name="name" required>

            <label>Description</label>
            <textarea name="description" required></textarea>

            <label>Price</label>
            <input type="number" name="price" step="0.01" required>

            <div class="checkbox-group">
                <input type="checkbox" id="vegeterian" name="vegeterian">
                <label for="vegeterian">Vegetarian</label>
            </div>

            <label>Image URL</label>
            <input type="url" name="picture" required>

            <button type="submit">
                Add Menu Item
            </button>

        </form>

    </div>

</div>

</body>
</html>
