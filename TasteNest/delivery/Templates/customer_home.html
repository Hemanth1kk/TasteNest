{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Page</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

<div class="customer-container">

    <h1 class="welcome">
        Welcome {{ username }} 👋
    </h1>

    <p class="subtitle">
        Discover delicious food from top restaurants
    </p>

    <table class="restaurant-table">

        <thead>
            <tr>
                <th>Restaurant</th>
                <th>Picture</th>
                <th>Cuisine</th>
                <th>Rating</th>
                <th>Operations</th>
            </tr>
        </thead>

        <tbody>

            {% for r in restaurantList %}

            <tr>

                <td>{{ r.name }}</td>

                <td>
                    <img src="{{ r.picture }}" class="restaurant-img">
                </td>

                <td>{{ r.cuisine }}</td>

                <td>
                    ⭐ {{ r.rating }}
                </td>

                <td>
                    <a href="{% url 'view_menu' r.id username %}"
                       class="menu-btn">
                        View Menu
                    </a>
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
